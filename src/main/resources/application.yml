server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/personal_hub?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: hub
    password: ${MYSQL_PASSWORD:hub123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  thymeleaf:
    cache: false
