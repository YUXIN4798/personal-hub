<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 - 请求有误</title>
    <script>
        (function () {
            try {
                var storedTheme = window.localStorage.getItem('theme');
                var systemTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
                document.documentElement.dataset.theme = storedTheme || systemTheme;
            } catch (error) {
                document.documentElement.dataset.theme = 'dark';
            }
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="min-h-screen text-[var(--ph-text)]">
<main class="mx-auto grid min-h-screen max-w-5xl place-items-center px-6">
    <section class="w-full border-l border-[var(--ph-accent)] py-10 pl-6 md:pl-10">
        <p class="eyebrow text-[0.68rem] text-[var(--ph-accent)]">400 / Bad Request</p>
        <h1 class="display mt-5 text-6xl leading-none text-[var(--ph-text)] md:text-8xl">请求参数有误</h1>
        <p class="mt-6 max-w-xl text-sm leading-7 text-[var(--ph-text-dim)]">当前请求无法被正确识别，请检查链接或返回首页重新访问。</p>
        <a th:href="@{/}" class="link-slide mt-8 inline-block text-sm font-medium text-[var(--ph-accent)]">返回首页</a>
    </section>
</main>
</body>
</html>
