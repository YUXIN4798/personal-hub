<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 - 请求有误</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { color-scheme: dark; --ink: #0b0f12; --teal: #56e3cd; --paper: #dce8e8; --muted: #8aa1a3; }
        body { background: #0b0f12; }
        .display { font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Georgia, serif; }
        .eyebrow { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; letter-spacing: 0.16em; text-transform: uppercase; }
        .link-slide { position: relative; text-decoration: none; }
        .link-slide::after { content: ""; position: absolute; right: 0; bottom: -0.2rem; left: 0; height: 1px; background: var(--teal); transform: scaleX(0); transform-origin: right; transition: transform 260ms cubic-bezier(0.22, 1, 0.36, 1); }
        .link-slide:hover::after, .link-slide:focus-visible::after { transform: scaleX(1); transform-origin: left; }
    </style>
</head>
<body class="min-h-screen text-[#dce8e8]">
<main class="mx-auto grid min-h-screen max-w-5xl place-items-center px-6">
    <section class="w-full border-l border-[#56e3cd]/70 py-10 pl-6 md:pl-10">
        <p class="eyebrow text-[0.68rem] text-[#56e3cd]">400 / Bad Request</p>
        <h1 class="display mt-5 text-6xl leading-none text-[#e5eeee] md:text-8xl">请求参数有误</h1>
        <p class="mt-6 max-w-xl text-sm leading-7 text-[#a9bfc0]">当前请求无法被正确识别，请检查链接或返回首页重新访问。</p>
        <a th:href="@{/}" class="link-slide mt-8 inline-block text-sm font-medium text-[#56e3cd]">返回首页</a>
    </section>
</main>
</body>
</html>
