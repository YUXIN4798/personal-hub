<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="min-h-screen text-[#dce8e8]">
<main class="mx-auto grid min-h-screen max-w-5xl place-items-center px-6">
    <section class="w-full border-l border-[#56e3cd]/70 py-10 pl-6 md:pl-10">
        <p class="eyebrow text-[0.68rem] text-[#56e3cd]">404 / Not Found</p>
        <h1 class="display mt-5 text-6xl leading-none text-[#e5eeee] md:text-8xl">页面未找到</h1>
        <p class="mt-6 max-w-xl text-sm leading-7 text-[#a9bfc0]" th:text="${message ?: '页面不存在或已被移除。'}">页面不存在或已被移除。</p>
        <a th:href="@{/}" class="link-slide mt-8 inline-block text-sm font-medium text-[#56e3cd]">返回首页</a>
    </section>
</main>
</body>
</html>
