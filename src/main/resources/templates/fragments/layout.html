<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | 曹铭轩 Personal Hub'">曹铭轩 Personal Hub</title>
    <meta name="description" content="曹铭轩的个人数字基地，聚焦 Java 后端与 AI 应用实践。">
    <script>
        (function () {
            try {
                var storedTheme = window.localStorage.getItem('theme');
                var systemTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
                document.documentElement.dataset.theme = storedTheme || systemTheme;
            } catch (error) {
                document.documentElement.dataset.theme = 'dark';
            }
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="min-h-screen text-[var(--ph-text)] antialiased selection:bg-[var(--ph-selection)] selection:text-[var(--ph-accent-contrast)]">
<div class="cursor-glow" aria-hidden="true"></div>
<div class="mx-auto flex min-h-screen max-w-[1440px] flex-col px-6 md:px-12 lg:px-16">
    <header class="site-header flex flex-wrap items-center justify-between gap-4 border-b py-6">
        <a th:href="@{/}" class="eyebrow text-[0.78rem] text-[var(--ph-text-dim)]">Cao Mingxuan<span class="ml-2 text-[var(--ph-accent)]">/ 26</span></a>
        <nav class="ml-auto flex flex-wrap items-center justify-end gap-3 text-sm md:gap-7" aria-label="主导航">
            <a th:href="@{/}" th:classappend="${pageTitle == '首页'} ? ' nav-active' : ''" class="nav-link">首页</a>
            <a th:href="@{/about}" th:classappend="${pageTitle == '关于我'} ? ' nav-active' : ''" class="nav-link">关于我</a>
            <a th:href="@{/resources}" th:classappend="${pageTitle == '资源库'} ? ' nav-active' : ''" class="nav-link">资源库</a>
            <a href="#contact" class="nav-link">联系</a>
            <button type="button" class="theme-toggle inline-grid h-9 w-9 place-items-center border" data-theme-toggle aria-label="切换到亮色主题" title="切换到亮色主题">
                <span data-theme-icon aria-hidden="true">🌙</span>
            </button>
        </nav>
    </header>

    <main class="flex-1 py-10 md:py-16" th:replace="${content}"></main>

    <footer id="contact" class="site-header border-t py-8">
        <div class="flex flex-col gap-3 text-sm text-[var(--ph-text-muted)] md:flex-row md:items-center md:justify-between">
            <p>© 2026 曹铭轩 · Personal Hub</p>
            <p class="text-[var(--ph-text-dim)]">邮箱：<a href="mailto:479819599@qq.com" class="link-slide text-[var(--ph-accent)]">479819599@qq.com</a> <span class="mx-2 text-[var(--ph-accent)]">·</span> 欢迎交流合作</p>
        </div>
    </footer>
</div>
<script th:src="@{/js/theme.js}" defer></script>
<script>
    (function () {
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const reveals = document.querySelectorAll('.reveal');
        if (!reducedMotion && reveals.length > 0 && 'IntersectionObserver' in window) {
            const observer = new IntersectionObserver((entries, revealObserver) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('reveal-in');
                        revealObserver.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.16, rootMargin: '0px 0px -8% 0px' });
            reveals.forEach((element) => observer.observe(element));
        } else {
            reveals.forEach((element) => element.classList.add('reveal-in'));
        }
        if (reducedMotion || !window.matchMedia('(pointer: fine)').matches) return;
        const glow = document.querySelector('.cursor-glow');
        let targetX = window.innerWidth * 0.5;
        let targetY = window.innerHeight * 0.25;
        let currentX = targetX;
        let currentY = targetY;
        let frameId = 0;
        let lastMoveAt = 0;
        let idleTimer = 0;
        const idleTimeout = 3000;
        const epsilon = 1;

        function scheduleGlow() {
            if (frameId === 0) {
                frameId = requestAnimationFrame(renderGlow);
            }
        }

        window.addEventListener('pointermove', (event) => {
            targetX = event.clientX;
            targetY = event.clientY;
            lastMoveAt = performance.now();
            glow.style.opacity = '1';
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                glow.style.opacity = '0';
            }, idleTimeout);
            scheduleGlow();
        }, { passive: true });

        function renderGlow() {
            frameId = 0;
            currentX += (targetX - currentX) * 0.1;
            currentY += (targetY - currentY) * 0.1;
            glow.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) translate(-50%, -50%)`;

            const closeToTarget = Math.abs(targetX - currentX) < epsilon && Math.abs(targetY - currentY) < epsilon;
            if (performance.now() - lastMoveAt > idleTimeout) {
                glow.style.opacity = '0';
                return;
            }
            if (!closeToTarget) {
                scheduleGlow();
            }
        }
    })();
</script>
</body>
</html>
