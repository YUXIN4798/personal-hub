<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('资源详情', ~{::content})}">
<article th:fragment="content" class="mx-auto min-h-[55vh] max-w-4xl space-y-10">
    <a th:href="@{/resources}" class="link-slide text-sm text-[var(--ph-text-dim)]">← 返回资源库</a>
    <header class="border-b border-[var(--ph-border)] pb-8">
        <p class="section-index text-[0.68rem] text-[var(--ph-accent)]"
           th:text="${category != null ? category.name : 'Resource'}">Resource</p>
        <h1 class="display mt-4 text-4xl leading-tight [overflow-wrap:anywhere] text-[var(--ph-text)] md:text-5xl" th:text="${resource.title}">资源名称</h1>
        <p th:if="${!#strings.isEmpty(resource.summary)}" class="[overflow-wrap:anywhere] mt-5 text-base leading-8 text-[var(--ph-text-dim)]" th:text="${resource.summary}">资源摘要</p>
        <div class="mt-6 flex flex-wrap gap-4 font-mono text-xs text-[var(--ph-text-muted)]">
            <span th:text="${resource.createdAt != null ? #temporals.format(resource.createdAt, 'yyyy-MM-dd') : '-'}">2026-08-17</span>
            <span th:text="${resource.version}">v1.0</span>
            <span th:text="${#numbers.formatDecimal(resource.fileSize / 1024.0 / 1024.0, 1, 2)} + ' MB'">0 MB</span>
            <span th:if="${resource.type == 'file'}" th:text="'下载 ' + ${resource.downloadCount}">下载 0</span>
            <span th:if="${resource.type == 'link'}">外部资源</span>
            <span th:each="tag : ${tags}" class="rounded border border-[var(--ph-border-strong)] px-2 py-1 text-[0.68rem] [overflow-wrap:anywhere]" th:text="${tag.name}">Java</span>
        </div>
    </header>
    <!-- Markdown 内容已由 commonmark 转义并渲染为安全 HTML -->
    <div th:if="${!#strings.isEmpty(renderedDescription)}" th:utext="${renderedDescription}" class="markdown-content min-h-[12rem] border-l border-[var(--ph-accent)] pl-5 [overflow-wrap:anywhere]">
        资源详细介绍
    </div>
    <a th:if="${resource.type == 'file'}"
       th:href="@{/resources/{id}/download(id=${resource.id})}"
       class="cta-button inline-flex items-center gap-3 border border-[var(--ph-accent)] bg-[var(--ph-accent)] px-5 py-3 text-sm font-medium text-[var(--ph-accent-contrast)]">
        下载资源 <span aria-hidden="true">↓</span>
    </a>
    <a th:if="${resource.type == 'link'}"
       th:href="${resource.url}"
       target="_blank" rel="noopener noreferrer"
       class="link-slide inline-flex text-sm font-medium text-[var(--ph-accent)]">
        访问链接
    </a>
</article>
</html>
