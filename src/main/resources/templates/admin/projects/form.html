<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/admin-layout :: layout(${pageTitle}, ~{::content})}">
<section th:fragment="content" class="mx-auto max-w-3xl space-y-5">
    <div>
        <a th:href="@{/admin/projects}" class="text-sm text-[var(--ph-accent)] hover:underline">返回列表</a>
        <h1 class="mt-3 text-2xl font-semibold text-[var(--ph-text-strong)]" th:text="${pageTitle}">项目表单</h1>
    </div>
    <form th:action="@{${formAction}}" th:object="${projectForm}" method="post" class="space-y-5 border border-[var(--ph-border)] bg-[var(--ph-card-solid)] p-5">
        <div class="grid gap-4 md:grid-cols-2">
            <div>
                <label for="title" class="block text-sm text-[var(--ph-text-dim)]">标题</label>
                <input id="title" type="text" th:field="*{title}" class="mt-2 w-full border border-[var(--ph-border)] bg-[var(--ph-bg-soft)] px-3 py-2">
                <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="mt-1 text-sm text-[var(--ph-danger)]">错误</p>
            </div>
            <div>
                <label for="slug" class="block text-sm text-[var(--ph-text-dim)]">Slug</label>
                <input id="slug" type="text" th:field="*{slug}" class="mt-2 w-full border border-[var(--ph-border)] bg-[var(--ph-bg-soft)] px-3 py-2">
                <p th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}" class="mt-1 text-sm text-[var(--ph-danger)]">错误</p>
            </div>
        </div>
        <div>
            <label for="description" class="block text-sm text-[var(--ph-text-dim)]">描述</label>
            <textarea id="description" th:field="*{description}" rows="5" class="mt-2 w-full border border-[var(--ph-border)] bg-[var(--ph-bg-soft)] px-3 py-2"></textarea>
            <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="mt-1 text-sm text-[var(--ph-danger)]">错误</p>
        </div>
        <div class="grid gap-4 md:grid-cols-3">
            <div>
                <label for="coverUrl" class="block text-sm text-[var(--ph-text-dim)]">封面 URL</label>
                <input id="coverUrl" type="url" th:field="*{coverUrl}" class="mt-2 w-full border border-[var(--ph-border)] bg-[var(--ph-bg-soft)] px-3 py-2">
            </div>
            <div>
                <label for="sourceUrl" class="block text-sm text-[var(--ph-text-dim)]">源码 URL</label>
                <input id="sourceUrl" type="url" th:field="*{sourceUrl}" class="mt-2 w-full border border-[var(--ph-border)] bg-[var(--ph-bg-soft)] px-3 py-2">
            </div>
            <div>
                <label for="demoUrl" class="block text-sm text-[var(--ph-text-dim)]">演示 URL</label>
                <input id="demoUrl" type="url" th:field="*{demoUrl}" class="mt-2 w-full border border-[var(--ph-border)] bg-[var(--ph-bg-soft)] px-3 py-2">
            </div>
        </div>
        <div class="grid gap-4 md:grid-cols-3">
            <div>
                <label for="status" class="block text-sm text-[var(--ph-text-dim)]">状态</label>
                <select id="status" th:field="*{status}" class="mt-2 w-full border border-[var(--ph-border)] bg-[var(--ph-bg-soft)] px-3 py-2">
                    <option value="draft">draft</option>
                    <option value="published">published</option>
                </select>
            </div>
            <div>
                <label for="publishedAt" class="block text-sm text-[var(--ph-text-dim)]">发布时间</label>
                <input id="publishedAt" type="datetime-local" th:field="*{publishedAt}" class="mt-2 w-full border border-[var(--ph-border)] bg-[var(--ph-bg-soft)] px-3 py-2">
            </div>
            <div>
                <label for="categoryId" class="block text-sm text-[var(--ph-text-dim)]">分类</label>
                <select id="categoryId" th:field="*{categoryId}" class="mt-2 w-full border border-[var(--ph-border)] bg-[var(--ph-bg-soft)] px-3 py-2">
                    <option value="">未分类</option>
                    <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">分类</option>
                </select>
            </div>
        </div>
        <fieldset>
            <legend class="text-sm text-[var(--ph-text-dim)]">标签</legend>
            <div class="mt-3 grid gap-2 sm:grid-cols-2 md:grid-cols-3">
                <label th:each="tag : ${tags}" class="flex items-center gap-2 border border-[var(--ph-border)] bg-[var(--ph-bg-soft)] px-3 py-2 text-sm text-[var(--ph-text-dim)]">
                    <input type="checkbox" th:field="*{tagIds}" th:value="${tag.id}" class="accent-[var(--ph-accent)]">
                    <span th:text="${tag.name}">Tag</span>
                </label>
            </div>
        </fieldset>
        <div class="flex justify-end gap-3 border-t border-[var(--ph-border)] pt-5">
            <a th:href="@{/admin/projects}" class="border border-[var(--ph-border)] px-4 py-2 text-sm text-[var(--ph-text-dim)]">取消</a>
            <button type="submit" class="bg-[var(--ph-accent)] px-4 py-2 text-sm font-medium text-[var(--ph-accent-contrast)] transition hover:brightness-110">保存</button>
        </div>
    </form>
</section>
</html>
