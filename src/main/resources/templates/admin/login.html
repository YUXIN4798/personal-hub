<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台登录 | Personal Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { color-scheme: dark; --ink: #080d10; --teal: #56e3cd; }
        body { background: var(--ink); }
        :focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
    </style>
</head>
<body class="min-h-screen bg-[#080d10] text-[#dce8e8] antialiased">
<main class="mx-auto flex min-h-screen max-w-md items-center px-6">
    <section class="w-full border border-[#a9c9c9]/20 bg-[#0d171a]/80 p-6">
        <p class="font-mono text-xs uppercase tracking-[0.18em] text-[#56e3cd]">Admin</p>
        <h1 class="mt-3 text-2xl font-semibold text-[#eef7f7]">Personal Hub 管理台</h1>
        <form th:action="@{/admin/login}" method="post" class="mt-6 space-y-4">
            <div>
                <label for="username" class="block text-sm text-[#a9bfc0]">用户名</label>
                <input id="username" name="username" type="text" autocomplete="username" required
                       class="mt-2 w-full border border-[#a9c9c9]/20 bg-[#081013] px-3 py-2 text-[#eef7f7]">
            </div>
            <div>
                <label for="password" class="block text-sm text-[#a9bfc0]">密码</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required
                       class="mt-2 w-full border border-[#a9c9c9]/20 bg-[#081013] px-3 py-2 text-[#eef7f7]">
            </div>
            <p th:if="${loginError}" th:text="${loginError}" class="text-sm text-[#ffb4a8]">用户名或密码错误</p>
            <button type="submit" class="w-full bg-[#56e3cd] px-4 py-2 font-medium text-[#06100f] transition hover:brightness-110">登录</button>
        </form>
    </section>
</main>
</body>
</html>
