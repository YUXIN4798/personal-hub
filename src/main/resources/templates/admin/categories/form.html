<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/admin-layout :: layout(${pageTitle}, ~{::content})}">
<section th:fragment="content" class="mx-auto max-w-3xl space-y-5">
    <div>
        <a th:href="@{/admin/categories}" class="text-sm text-[var(--ph-accent)] hover:underline">返回列表</a>
        <h1 class="mt-3 text-2xl font-semibold text-[var(--ph-text-strong)]" th:text="${pageTitle}">分类表单</h1>
    </div>
    <form th:action="@{${formAction}}" th:object="${categoryForm}" method="post" class="space-y-5 border border-[var(--ph-border)] bg-[var(--ph-card-solid)] p-5">
        <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="grid gap-4 md:grid-cols-2">
            <div>
                <label for="name" class="block text-sm text-[var(--ph-text-dim)]">分类名称</label>
                <input id="name" type="text" th:field="*{name}" class="mt-2 w-full border border-[var(--ph-border)] bg-[var(--ph-bg-soft)] px-3 py-2">
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-sm text-[var(--ph-danger)]">错误</p>
            </div>
            <div>
                <label for="slug" class="block text-sm text-[var(--ph-text-dim)]">Slug</label>
                <input id="slug" type="text" th:field="*{slug}" class="mt-2 w-full border border-[var(--ph-border)] bg-[var(--ph-bg-soft)] px-3 py-2">
                <p class="mt-1 text-xs text-[var(--ph-text-muted)]">可留空，保存时自动生成。</p>
                <p th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}" class="mt-1 text-sm text-[var(--ph-danger)]">错误</p>
            </div>
        </div>
        <div class="grid gap-4 md:grid-cols-2">
            <div th:if="${!editing}">
                <label for="type" class="block text-sm text-[var(--ph-text-dim)]">类型</label>
                <select id="type" th:field="*{type}" class="mt-2 w-full border border-[var(--ph-border)] bg-[var(--ph-bg-soft)] px-3 py-2">
                    <option th:each="typeEntry : ${typeLabels}" th:value="${typeEntry.key}" th:text="${typeEntry.value}">项目</option>
                </select>
                <p th:if="${#fields.hasErrors('type')}" th:errors="*{type}" class="mt-1 text-sm text-[var(--ph-danger)]">错误</p>
            </div>
            <div th:if="${editing}">
                <label class="block text-sm text-[var(--ph-text-dim)]">类型</label>
                <input type="hidden" th:field="*{type}">
                <p class="mt-2 border border-[var(--ph-border)] bg-[var(--ph-bg-soft)] px-3 py-2 text-sm text-[var(--ph-text-dim)]" th:text="${typeLabel}">项目</p>
            </div>
            <div>
                <label for="sortOrder" class="block text-sm text-[var(--ph-text-dim)]">排序</label>
                <input id="sortOrder" type="number" min="0" th:field="*{sortOrder}" class="mt-2 w-full border border-[var(--ph-border)] bg-[var(--ph-bg-soft)] px-3 py-2">
                <p th:if="${#fields.hasErrors('sortOrder')}" th:errors="*{sortOrder}" class="mt-1 text-sm text-[var(--ph-danger)]">错误</p>
            </div>
        </div>
        <div class="flex justify-end gap-3 border-t border-[var(--ph-border)] pt-5">
            <a th:href="@{/admin/categories}" class="border border-[var(--ph-border)] px-4 py-2 text-sm text-[var(--ph-text-dim)]">取消</a>
            <button type="submit" class="bg-[var(--ph-accent)] px-4 py-2 text-sm font-medium text-[var(--ph-accent-contrast)] transition hover:brightness-110">保存</button>
        </div>
    </form>
</section>
</html>
